openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone and session authentication
  - name: profile
    description: Authenticated profile setup and updates
  - name: businesses
    description: Business account registration and editing
  - name: service-providers
    description: Service provider account registration and editing
  - name: marketplace
    description: Discovery surfaces
  - name: ai
    description: Provider-neutral ShopNear AI search, recommendations, and preferences
  - name: admin
    description: Administrator-only settings and category management
  - name: storage
    description: Authenticated media upload preparation
  - name: chat
    description: Customer and listing-owner conversations
  - name: notifications
    description: In-app notification history and preferences
  - name: reviews
    description: Customer reviews, ratings, and moderation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "429":
          description: Too many requests
  /login:
    post:
      operationId: login
      tags: [auth]
      summary: Start phone login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify a phone code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid or expired code
  /verify-otp:
    post:
      operationId: verifyOtpAlias
      tags: [auth]
      summary: Verify a phone code compatibility alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Validate the current session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: No active session
  /register:
    post:
      operationId: register
      tags: [auth]
      summary: Complete a verified account registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the authenticated profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update the authenticated profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /location:
    get:
      operationId: getLocation
      tags: [profile]
      summary: Read the authenticated user's location state
      responses:
        "200":
          description: Location state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    put:
      operationId: updateLocation
      tags: [profile]
      summary: Update the authenticated user's GPS location and permission state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated location state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /businesses:
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Register a business account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Business registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /businesses/mine:
    get:
      operationId: getMyBusiness
      tags: [businesses]
      summary: Get the authenticated user's business
      responses:
        "200":
          description: Business registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Business not registered
  /businesses/{id}:
    get:
      operationId: getBusinessDetail
      tags: [marketplace]
      summary: Read a public business detail page
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Business detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetail"
        "404":
          description: Business not found
    put:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update an owned business
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /service-providers:
    post:
      operationId: createServiceProvider
      tags: [service-providers]
      summary: Register a service provider account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProviderInput"
      responses:
        "201":
          description: Service provider registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProvider"
  /service-providers/mine:
    get:
      operationId: getMyServiceProvider
      tags: [service-providers]
      summary: Get the authenticated user's service provider profile
      responses:
        "200":
          description: Service provider registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProvider"
        "404":
          description: Service provider not registered
  /service-providers/{id}:
    put:
      operationId: updateServiceProvider
      tags: [service-providers]
      summary: Update an owned service provider
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProviderUpdate"
      responses:
        "200":
          description: Updated service provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProvider"
  /businesses/{id}/location:
    put:
      operationId: updateBusinessLocation
      tags: [businesses]
      summary: Update an owned business location
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated business location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /service-providers/{id}/location:
    put:
      operationId: updateServiceProviderLocation
      tags: [service-providers]
      summary: Update an owned service provider location
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated service provider location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /new-on-shopnear:
    get:
      operationId: getNewOnShopNear
      tags: [marketplace]
      summary: List recently approved businesses and service providers
      responses:
        "200":
          description: New listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewOnShopNear"
  /marketplace/categories:
    get:
      operationId: getMarketplaceCategories
      tags: [marketplace]
      summary: List product and service categories
      responses:
        "200":
          description: Marketplace categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceCategories"
  /marketplace/catalog:
    get:
      operationId: getMarketplaceCatalog
      tags: [marketplace]
      summary: List visible, available marketplace listings
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: newest
          in: query
          schema: { type: boolean }
        - name: tag
          in: query
          schema: { type: string, maxLength: 40 }
        - name: location
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Marketplace catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceCatalog"
  /marketplace/featured:
    get:
      operationId: getFeaturedMarketplace
      tags: [marketplace]
      summary: List featured, trending, and newest marketplace records
      responses:
        "200":
          description: Featured marketplace records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedMarketplace"
  /marketplace/search:
    get:
      operationId: searchMarketplace
      tags: [marketplace]
      summary: Search businesses, providers, products, and services
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: verified
          in: query
          schema: { type: boolean }
        - name: city
          in: query
          schema: { type: string, maxLength: 80 }
        - name: state
          in: query
          schema: { type: string, maxLength: 80 }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: newest
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Marketplace search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSearch"
  /marketplace/nearby:
    get:
      operationId: getNearbyMarketplace
      tags: [marketplace]
      summary: Find verified nearby businesses, providers, products, and services within a radius
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, minimum: 0.1, maximum: 100, default: 25 }
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: city
          in: query
          schema: { type: string, maxLength: 80 }
        - name: state
          in: query
          schema: { type: string, maxLength: 80 }
        - name: verified
          in: query
          schema: { type: boolean, default: true }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: newest
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Nearby marketplace results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyMarketplace"
  /ai/search:
    post:
      operationId: aiSearch
      tags: [ai]
      summary: Interpret a natural-language request and search public marketplace listings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISearchInput"
      responses:
        "200":
          description: Structured intent, public results, and next-search suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISearchResponse"
        "400":
          description: Invalid search input
        "429":
          description: AI request rate limit exceeded
  /ai/recommendations:
    get:
      operationId: getAIRecommendations
      tags: [ai]
      summary: Rank approved marketplace listings for discovery
      parameters:
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, minimum: 0.1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Recommendation groups and safe fallback suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIRecommendations"
        "400":
          description: Invalid coordinates or radius
        "429":
          description: AI request rate limit exceeded
  /ai/suggestions:
    get:
      operationId: getAISuggestions
      tags: [ai]
      summary: Generate query corrections, related searches, and category suggestions
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 240 }
      responses:
        "200":
          description: Search suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISuggestions"
        "429":
          description: AI request rate limit exceeded
  /ai/history:
    get:
      operationId: getAIHistory
      tags: [ai]
      summary: List the authenticated user's recent AI searches
      security:
        - cookieSession: []
      responses:
        "200":
          description: Recent searches, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIHistory"
        "401":
          description: Authentication required
    delete:
      operationId: clearAIHistory
      tags: [ai]
      summary: Delete the authenticated user's AI search history
      security:
        - cookieSession: []
      responses:
        "200":
          description: Number of history entries deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIHistoryDelete"
        "401":
          description: Authentication required
  /ai/preferences:
    get:
      operationId: getAIPreferences
      tags: [ai]
      summary: Get the authenticated user's AI preferences
      security:
        - cookieSession: []
      responses:
        "200":
          description: AI preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIPreferences"
        "401":
          description: Authentication required
    put:
      operationId: updateAIPreferences
      tags: [ai]
      summary: Update the authenticated user's AI preferences
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIPreferencesUpdate"
      responses:
        "200":
          description: Updated AI preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIPreferences"
        "400":
          description: Invalid preference settings
        "401":
          description: Authentication required
  /products/{id}:
    get:
      operationId: getProductDetail
      tags: [marketplace]
      summary: Read a public product detail page
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
  /services/{id}:
    get:
      operationId: getServiceDetail
      tags: [marketplace]
      summary: Read a public service detail page
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDetail"
        "404":
          description: Service not found
  /favorites:
    get:
      operationId: getFavorites
      tags: [marketplace]
      summary: List the authenticated customer's favorites
      security:
        - cookieSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorites"
        "401":
          description: Authentication required
    post:
      operationId: addFavorite
      tags: [marketplace]
      summary: Save a business, product, or service
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Favorite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteMutation"
        "200":
          description: Favorite already existed
        "404":
          description: Listing not found
  /favorites/{targetType}/{targetId}:
    delete:
      operationId: removeFavorite
      tags: [marketplace]
      summary: Remove a saved marketplace item
      security:
        - cookieSession: []
      parameters:
        - name: targetType
          in: path
          required: true
          schema: { type: string, enum: [business, product, service] }
        - name: targetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Favorite removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404":
          description: Favorite not found
  /business/dashboard:
    get:
      operationId: getBusinessDashboard
      tags: [businesses]
      summary: Read business marketplace metrics
      responses:
        "200":
          description: Business dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDashboard"
  /business/products:
    get:
      operationId: getMyProducts
      tags: [businesses]
      summary: List products owned by the business
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [businesses]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /business/products/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateProduct
      tags: [businesses]
      summary: Update an owned product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [businesses]
      summary: Delete an owned product
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /provider/services:
    get:
      operationId: getMyServices
      tags: [service-providers]
      summary: List owned services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
    post:
      operationId: createService
      tags: [service-providers]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
  /provider/services/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateService
      tags: [service-providers]
      summary: Update an owned service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    delete:
      operationId: deleteService
      tags: [service-providers]
      summary: Delete an owned service
      responses:
        "200":
          description: Service deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/settings/new-on-shopnear:
    get:
      operationId: getNewOnShopNearSettings
      tags: [admin]
      summary: Read the new-listing window
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewOnShopNearSettings"
    put:
      operationId: updateNewOnShopNearSettings
      tags: [admin]
      summary: Update the new-listing window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOnShopNearSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewOnShopNearSettings"
  /admin/categories:
    get:
      operationId: getAdminCategories
      tags: [admin]
      summary: List all product or service categories
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [products, services] }
      responses:
        "200":
          description: Category administration list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategories"
    post:
      operationId: createAdminCategory
      tags: [admin]
      summary: Create a product or service category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/categories/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [products, services] }
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateAdminCategory
      tags: [admin]
      summary: Update a product or service category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteAdminCategory
      tags: [admin]
      summary: Delete a product or service category
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request an authenticated direct upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /chat/events:
    get:
      operationId: subscribeChatEvents
      tags: [chat]
      summary: Subscribe to authenticated live chat and notification updates
      security:
        - cookieSession: []
      responses:
        "200":
          description: Server-sent event stream; reconnects rehydrate through the REST endpoints
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: Authentication required
  /chat/conversations:
    get:
      operationId: listChatConversations
      tags: [chat]
      summary: List the current user's conversations with unread counts
      security:
        - cookieSession: []
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Paginated conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConversationPage" }
        "401":
          description: Authentication required
    post:
      operationId: createChatConversation
      tags: [chat]
      summary: Start or reopen a customer conversation with a public business or provider listing
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationInput" }
      responses:
        "200":
          description: Existing conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConversation" }
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConversation" }
        "400":
          description: Invalid request or role
        "404":
          description: Public listing not found
  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: Get a conversation's messages and mark incoming messages read
      security:
        - cookieSession: []
      parameters:
        - name: conversationId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Conversation message page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "403":
          description: Not a conversation participant
        "404":
          description: Conversation not found
  /chat/conversations/{id}/messages:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a plain-text message
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "403":
          description: Not a participant or the other user is blocked
        "429":
          description: Message rate limit exceeded
  /chat/conversations/{id}/read:
    put:
      operationId: markConversationRead
      tags: [chat]
      summary: Mark a conversation's incoming messages as read
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Read state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /chat/conversations/{id}/typing:
    put:
      operationId: updateChatTyping
      tags: [chat]
      summary: Publish a short-lived typing state to the other participant
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TypingInput" }
      responses:
        "200":
          description: Typing state accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /chat/messages/{id}:
    delete:
      operationId: deleteChatMessage
      tags: [chat]
      summary: Soft-delete a message sent by the current user
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Message soft-deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403":
          description: Only the sender can delete this message
  /chat/conversations/{id}/report:
    post:
      operationId: reportChatConversation
      tags: [chat]
      summary: Report a conversation for moderation
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentReport" }
  /chat/blocks/{userId}:
    post:
      operationId: blockChatUser
      tags: [chat]
      summary: Block another user from messaging the current user
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    delete:
      operationId: unblockChatUser
      tags: [chat]
      summary: Remove a user block
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User unblocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /chat/blocks:
    get:
      operationId: listChatBlocks
      tags: [chat]
      summary: List users blocked by the current user
      security:
        - cookieSession: []
      responses:
        "200":
          description: Blocked users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedUsers" }
        "401":
          description: Authentication required
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the current user's notification history
      security:
        - cookieSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Paginated notification history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
  /notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      tags: [notifications]
      summary: Count unread notifications
      security:
        - cookieSession: []
      responses:
        "200":
          description: Unread notification count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }
  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Read state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - cookieSession: []
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationReadCount" }
  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      tags: [notifications]
      summary: Read per-category notification preferences
      security:
        - cookieSession: []
      responses:
        "200":
          description: Current preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    put:
      operationId: updateNotificationPreferences
      tags: [notifications]
      summary: Update per-category notification preferences
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesInput" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
  /admin/notifications/announcements:
    post:
      operationId: createNotificationAnnouncement
      tags: [notifications, admin]
      summary: Send an in-app announcement to active users
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Announcement delivery summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementResult" }
        "403":
          description: Administrator role required
  /ratings/{targetType}/{targetId}:
    get:
      operationId: getRatingSummary
      tags: [reviews]
      summary: Get average, count, and 1–5 star distribution
      parameters:
        - name: targetType
          in: path
          required: true
          schema: { type: string, enum: [business, product, service] }
        - name: targetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Aggregated public rating
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RatingSummary" }
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List visible reviews for a business, product, or service
      parameters:
        - name: targetType
          in: query
          required: true
          schema: { type: string, enum: [business, product, service] }
        - name: targetId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a customer review with a 1–5 star rating
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "409":
          description: The customer already reviewed this listing; update the existing review
  /reviews/mine:
    get:
      operationId: getMyReview
      tags: [reviews]
      summary: Get the current customer's review for a listing, if any
      security:
        - cookieSession: []
      parameters:
        - name: targetType
          in: query
          required: true
          schema: { type: string, enum: [business, product, service] }
        - name: targetId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Existing review or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyReview" }
  /reviews/{id}:
    put:
      operationId: updateReview
      tags: [reviews]
      summary: Edit the current customer's review
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewUpdate" }
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "403":
          description: Review ownership required
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete the current customer's review
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Review deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /reviews/{id}/report:
    post:
      operationId: reportReview
      tags: [reviews]
      summary: Report a review for moderation
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentReport" }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [reviews, admin]
      summary: List reviews for moderation
      security:
        - cookieSession: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [visible, hidden] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Reviews pending moderation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewModerationPage" }
  /admin/reviews/{id}/moderation:
    patch:
      operationId: moderateReview
      tags: [reviews, admin]
      summary: Hide or restore a review
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewModerationInput" }
      responses:
        "200":
          description: Moderation state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
  /admin/content-reports:
    get:
      operationId: listContentReports
      tags: [reviews, admin]
      summary: List conversation and review reports
      security:
        - cookieSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Paginated moderation reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentReportPage" }
  /admin/content-reports/{id}:
    patch:
      operationId: updateContentReport
      tags: [reviews, admin]
      summary: Resolve or dismiss a content report
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportStatusInput" }
      responses:
        "200":
          description: Report status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentReport" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: shopnear_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          maxLength: 20
      required: [phone]
    OtpVerification:
      type: object
      properties:
        phone:
          type: string
          minLength: 7
          maxLength: 20
        code:
          type: string
          minLength: 6
          maxLength: 6
      required: [phone, code]
    OtpChallenge:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        developmentOtp:
          type: ["string", "null"]
      required: [challengeId, expiresAt, developmentOtp]
    AuthResult:
      type: object
      properties:
        authenticated:
          type: boolean
        needsRegistration:
          type: boolean
        phone:
          type: ["string", "null"]
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [authenticated, needsRegistration, phone, user]
    Registration:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        accountType:
          type: string
          enum: [customer, business, service_provider]
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        address:
          type: string
          maxLength: 250
        preferredLanguage:
          type: string
          maxLength: 10
        notificationsEnabled:
          type: boolean
      required: [fullName, accountType]
    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        profilePhoto:
          type: ["string", "null"]
          maxLength: 500
        city:
          type: ["string", "null"]
          maxLength: 80
        state:
          type: ["string", "null"]
          maxLength: 80
        address:
          type: ["string", "null"]
          maxLength: 250
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        preferredLanguage:
          type: ["string", "null"]
          maxLength: 10
        notificationsEnabled:
          type: boolean
    LocationUpdate:
      type: object
      properties:
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        accuracy: { type: ["number", "null"], minimum: 0, maximum: 100000 }
        enabled: { type: boolean }
        visibility: { type: string, enum: [public, private] }
        permissionStatus: { type: string, enum: [prompt, granted, denied, unavailable] }
        city: { type: ["string", "null"], maxLength: 80 }
        state: { type: ["string", "null"], maxLength: 80 }
    Location:
      type: object
      properties:
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        accuracy: { type: ["number", "null"] }
        updatedAt: { type: ["string", "null"], format: date-time }
        enabled: { type: boolean }
        visibility: { type: string, enum: [public, private] }
        permissionStatus: { type: string, enum: [prompt, granted, denied, unavailable] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
      required: [latitude, longitude, accuracy, updatedAt, enabled, visibility, permissionStatus]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        accountType:
          type: string
          enum: [customer, business, service_provider, admin]
        profilePhoto:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        preferredLanguage:
          type: string
        notificationsEnabled:
          type: boolean
        locationAccuracy:
          type: ["integer", "null"]
        locationUpdatedAt:
          type: ["string", "null"]
          format: date-time
        locationEnabled:
          type: boolean
        locationPermissionStatus:
          type: string
        locationVisibility:
          type: string
          enum: [public, private]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, fullName, phone, email, accountType, profilePhoto, city, state, address, preferredLanguage, notificationsEnabled, status, createdAt]
    BusinessInput:
      type: object
      properties:
        businessName: { type: string, minLength: 2, maxLength: 160 }
        category: { type: string, minLength: 2, maxLength: 100 }
        businessLogo: { type: ["string", "null"], maxLength: 500 }
        coverPhoto: { type: ["string", "null"], maxLength: 500 }
        description: { type: ["string", "null"], maxLength: 2000 }
        workingHours: { type: ["object", "null"], additionalProperties: true }
        businessAddress: { type: ["string", "null"], maxLength: 250 }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        locationAccuracy: { type: ["integer", "null"] }
        locationUpdatedAt: { type: ["string", "null"], format: date-time }
        locationEnabled: { type: boolean }
        locationVisibility: { type: string, enum: [public, private] }
        whatsapp: { type: ["string", "null"], maxLength: 20 }
        phone: { type: ["string", "null"], maxLength: 20 }
        website: { type: ["string", "null"], maxLength: 500 }
        socialLinks: { type: ["object", "null"], additionalProperties: true }
      required: [businessName, category]
    BusinessUpdate:
      allOf:
        - $ref: "#/components/schemas/BusinessInput"
    Business:
      allOf:
        - $ref: "#/components/schemas/BusinessInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            verificationStatus: { type: string }
            approvedAt: { type: ["string", "null"], format: date-time }
            createdAt: { type: string, format: date-time }
            distanceKm: { type: ["number", "null"] }
            travelDistanceMeters: { type: ["number", "null"] }
            travelTimeSeconds: { type: ["number", "null"] }
          required: [id, ownerId, verificationStatus, approvedAt, createdAt]
    ServiceProviderInput:
      type: object
      properties:
        profession: { type: string, minLength: 2, maxLength: 120 }
        experience: { type: ["string", "null"], maxLength: 120 }
        skills: { type: array, items: { type: string }, maxItems: 20 }
        serviceRadius: { type: ["integer", "null"], minimum: 0, maximum: 500 }
        portfolioImages: { type: array, items: { type: string, maxLength: 500 }, maxItems: 12 }
        availability: { type: ["object", "null"], additionalProperties: true }
        phone: { type: ["string", "null"], maxLength: 20 }
        whatsapp: { type: ["string", "null"], maxLength: 20 }
        location: { type: ["string", "null"], maxLength: 250 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        locationAccuracy: { type: ["integer", "null"], minimum: 0, maximum: 100000 }
        locationUpdatedAt: { type: ["string", "null"], format: date-time }
        locationEnabled: { type: boolean }
        locationVisibility: { type: string, enum: [public, private] }
      required: [profession]
    ServiceProviderUpdate:
      allOf:
        - $ref: "#/components/schemas/ServiceProviderInput"
    ServiceProvider:
      allOf:
        - $ref: "#/components/schemas/ServiceProviderInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            verificationStatus: { type: string }
            approvedAt: { type: ["string", "null"], format: date-time }
            createdAt: { type: string, format: date-time }
            distanceKm: { type: ["number", "null"] }
            travelDistanceMeters: { type: ["number", "null"] }
            travelTimeSeconds: { type: ["number", "null"] }
          required: [id, ownerId, verificationStatus, approvedAt, createdAt]
    NewOnShopNearSettings:
      type: object
      properties:
        days:
          type: integer
          minimum: 0
          maximum: 365
      required: [days]
    NewOnShopNear:
      type: object
      properties:
        businesses:
          type: array
          items: { $ref: "#/components/schemas/Business" }
        serviceProviders:
          type: array
          items: { $ref: "#/components/schemas/ServiceProvider" }
        days:
          type: integer
      required: [businesses, serviceProviders, days]
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        isFeatured: { type: boolean }
